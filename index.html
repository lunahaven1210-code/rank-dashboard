<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rank Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{--bg:#fbfbfa;--card:#fff;--ink:#1c1b19;--dim:#6b6862;--line:#e6e3dd;--soft:#f4f2ee;
        --up:#12805c;--down:#c0392b;--warn:#a8620d;--accent:#2f6f4e;--accent-ink:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#17181a;--card:#1f2124;--ink:#eceae6;--dim:#9b9791;--line:#33363b;--soft:#26292d;
        --up:#4ac795;--down:#f0776a;--warn:#e0a458;--accent:#4f9c74;--accent-ink:#0f1211}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Pretendard","Malgun Gothic",sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:30px 20px 80px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-bottom:18px}
  nav{display:flex;gap:2px;margin:18px 0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
    font:inherit;font-size:14px;padding:9px 14px;cursor:pointer;margin-bottom:-1px}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h2 .day{color:var(--dim);font-weight:400;font-size:12px}
  h2 .spacer{flex:1}
  .hint{color:var(--dim);font-size:13px;margin:-4px 0 12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=text]{flex:1;min-width:200px;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;font-size:14px}
  input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;
    padding:8px 14px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;
    text-decoration:none;display:inline-block}
  .btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;padding:0 10px 8px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .kw{font-weight:500}
  .rank{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
  .out{color:var(--dim);font-weight:400;font-size:13px}
  .sm{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums}
  .d{font-size:12px;font-variant-numeric:tabular-nums;margin-left:6px}
  .d.up{color:var(--up)} .d.down{color:var(--down)} .d.same{color:var(--dim)}
  .empty{color:var(--dim);font-size:14px;padding:8px 0}
  code{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px}
  a{color:var(--accent)}
  .pick{display:flex;justify-content:space-between;gap:12px;align-items:center;
    padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--bg)}
  .pick.on{border-color:var(--accent);background:var(--soft)}
  .pick .nm{font-weight:500}
  .pick .meta{color:var(--dim);font-size:12.5px;margin-top:2px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);
    border-radius:99px;padding:3px 6px 3px 10px;font-size:13px;margin:0 5px 5px 0}
  .chip button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
  .chip button:hover{color:var(--down)}
  .chip.off{opacity:.5;text-decoration:line-through}
  .chip.off button{text-decoration:none;color:var(--accent)}
  .tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .tag.local{border-color:var(--accent);color:var(--accent)}
  .tag.ad{border-color:var(--warn);color:var(--warn)}
  pre.log{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:12px;
    font-size:12.5px;max-height:220px;overflow:auto;margin:12px 0 0;white-space:pre-wrap}
  .msg{font-size:13px;padding:9px 12px;border-radius:8px;margin-top:10px}
  .msg.err{background:color-mix(in srgb,var(--down) 12%,transparent);color:var(--down)}
  .alert{background:color-mix(in srgb,var(--down) 9%,transparent);border:1px solid color-mix(in srgb,var(--down) 35%,var(--line))}
  .alert h2{color:var(--down)}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--soft)}
  tr.open td{background:var(--soft)}
  .caret{color:var(--dim);font-size:11px;margin-right:6px;display:inline-block;width:9px}
  .detail td{background:var(--soft);padding:16px 14px}
  .detail h3{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:500}
  .detail .cols{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .detail .cols > div{flex:1;min-width:290px}
  .mini{width:100%;min-width:0;border-collapse:collapse;font-size:13px;table-layout:auto}
  .mini td{padding:5px 8px;border-bottom:1px solid var(--line);background:none}
  .mini tr:last-child td{border-bottom:0}
  .mini .r{color:var(--dim);font-variant-numeric:tabular-nums;width:34px}
  .mini .mine{background:color-mix(in srgb,var(--accent) 15%,transparent);font-weight:600}
  .mini .rv{color:var(--dim);font-size:11.5px;text-align:right;white-space:nowrap;padding-left:10px}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px}
  .stat{color:var(--dim);font-size:12.5px;font-weight:400}
  select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font:inherit;font-size:14px;max-width:100%}
  .grid{border-collapse:separate;border-spacing:0;font-size:12.5px;width:auto}
  .grid th,.grid td{border:0;padding:0;white-space:nowrap}
  .grid th{padding:0 0 6px;font-size:11px;color:var(--dim);text-align:center;font-weight:400}
  .grid th.k,.grid td.k{position:sticky;left:0;z-index:1;background:var(--card);
    text-align:left;padding-right:14px;font-size:13px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .grid td.k{font-weight:500}
  .cell{display:block;width:30px;height:26px;line-height:26px;text-align:center;margin:0 1px 2px 0;
    border-radius:5px;font-variant-numeric:tabular-nums;color:var(--ink)}
  .t1{background:color-mix(in srgb,var(--accent) 62%,transparent);color:#fff;font-weight:600}
  .t2{background:color-mix(in srgb,var(--accent) 38%,transparent)}
  .t3{background:color-mix(in srgb,var(--accent) 20%,transparent)}
  .t4{background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .tout{background:color-mix(in srgb,var(--down) 13%,transparent);color:var(--down);font-size:11px}
  .tnone{background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--line) 3px,var(--line) 4px);color:transparent}
  .legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:12px;color:var(--dim)}
  .legend .cell{width:22px;height:18px;line-height:18px;font-size:10px}
  .blockhead{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px 9px 0 0;
    background:var(--soft);overflow:hidden}
  .blockhead > div{padding:9px 14px}
  .blockhead .kwname{font-weight:600;border-right:1px solid var(--line);min-width:190px}
  .blockhead .storename{flex:1;border-right:1px solid var(--line)}
  .blockhead .pid{color:var(--accent);font-size:13px;white-space:nowrap}
  .adlog{border-collapse:collapse;width:100%;table-layout:fixed}
  .adlog th,.adlog td{border:1px solid var(--line);border-top:0;text-align:center;padding:9px 8px;
    min-width:118px;vertical-align:top}
  .adlog th{background:var(--card);font-size:13px;color:var(--ink);font-weight:500;padding:7px 6px}
  .adlog th .sun{color:#d0463b} .adlog th .sat{color:#3b6fd0}
  .adlog .rk{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
  .adlog .rk.outr{font-size:14px;font-weight:500;color:var(--dim)}
  .adlog .save{color:var(--up);font-weight:600;font-size:13px}
  .adlog .m{font-size:12.5px;color:var(--ink)}
  .adlog .g{font-size:12px;color:var(--dim)}
  .adlog .none{color:var(--dim);font-size:12px;padding-top:18px}
  .adlog .adbadge{font-size:11px;color:var(--warn)}
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .modes button{background:var(--bg);border:0;color:var(--dim);font:inherit;font-size:13px;
    padding:8px 13px;cursor:pointer}
  .modes button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
  .addkw{display:flex;gap:6px;margin-top:8px;align-items:center}
  .addkw input{flex:1;min-width:150px;padding:6px 10px;font-size:13px}
  .addkw button{padding:6px 12px;font-size:13px}
</style>
</head>
<body>
<div id="lock" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px">
  <form id="lockForm" style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(360px,100%)">
    <div style="font-weight:600;font-size:16px;margin-bottom:4px">Rank Dashboard</div>
    <div class="hint" style="margin:0 0 14px">열람 비밀번호를 입력하세요.</div>
    <input type="password" id="lockPw" placeholder="비밀번호" autocomplete="current-password"
      style="width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit">
    <button class="btn" style="width:100%;margin-top:10px">열기</button>
    <div id="lockErr" class="hint" style="color:var(--down);display:none;margin:10px 0 0">비밀번호가 맞지 않습니다.</div>
  </form>
</div>
<div class="wrap" style="display:none">
  <h1 id="hd">Rank Dashboard</h1>
  <div class="sub" id="hdsub">&nbsp;</div>
  <div id="top"></div>
  <nav>
    <button data-tab="store" class="on">매장별</button>
    <button data-tab="daily">일별 추이</button>
    <button data-tab="keyword">키워드별</button>
    <button data-tab="manage">대상 관리</button>
  </nav>
  <div id="view"><div class="empty">불러오는 중…</div></div>
</div>
<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if(cls) e.className = cls; if(txt!=null) e.textContent = txt; return e; };
// 정적 스냅샷 — 서버 대신 암호화된 내장 데이터에서 읽는다.
let DATA = null;

function sliceDaily(full, n, pad){
  if (!full || !full.days?.length)
    return { placeId: full?.placeId ?? null, label: full?.label ?? null, days: [], keywords: [], missingDays: [] };
  const missing = new Set(full.missingDays ?? []);
  let start = full.days.length - Math.min(n, full.days.length);
  if (!pad){ // 수집이 시작되기 전 구간은 잘라낸다 (서버의 pad=false 동작 재현)
    const first = full.days.findIndex(d => !missing.has(d));
    if (first > start) start = first;
  }
  const days = full.days.slice(start);
  const keywords = full.keywords.map(k => {
    const cells = k.cells.slice(start);
    const ranked = cells.map(c => c.rank).filter(v => v != null);
    return { ...k, cells, best: ranked.length ? Math.min(...ranked) : null,
             worst: ranked.length ? Math.max(...ranked) : null };
  }).sort((a, b) => (a.best ?? 999) - (b.best ?? 999));
  return { placeId: full.placeId, label: full.label, days, keywords,
           missingDays: days.filter(d => missing.has(d)) };
}

const api = async (path) => {
  const url = new URL(path, location.href);
  const p = url.pathname.slice(url.pathname.lastIndexOf('/api')), sp = url.searchParams;
  if (p === '/api/summary')  return DATA.summary;
  if (p === '/api/by-store') return DATA.byStore;
  if (p === '/api/targets')  return DATA.targets;
  if (p === '/api/daily')
    return sliceDaily(DATA.daily[String(sp.get('placeId'))], Number(sp.get('days') || 7), sp.get('pad') === '1');
  if (p === '/api/place-detail'){
    const d = DATA.detail[sp.get('keyword') + '|' + sp.get('placeId')];
    if (!d) throw new Error('이 스냅샷에는 없는 데이터입니다');
    return d;
  }
  throw new Error('읽기 전용 스냅샷에서는 지원하지 않습니다');
};

let tab = 'store';
let picked = null;
let search = { q:'', items:null };

function msg(parent, text, kind='err'){
  parent.querySelectorAll('.msg').forEach(m=>m.remove());
  parent.append(el('div','msg '+kind, text));
}

// ---------- 공통 ----------
function delta(cur, prev){
  const d = el('span');
  if (cur == null || prev == null){ d.className='d same'; d.textContent='–'; return d; }
  const diff = prev - cur;
  if (diff > 0) { d.className='d up';   d.textContent='▲'+diff; }
  else if (diff < 0){ d.className='d down'; d.textContent='▼'+(-diff); }
  else { d.className='d same'; d.textContent='–'; }
  return d;
}
function rankCell(rank, prev, cap){
  const td = el('td'), s = el('span','rank');
  if (rank == null){ s.className='rank out'; s.textContent = cap+'위 밖'; }
  else s.textContent = rank+'위';
  td.append(s); if (prev !== undefined) td.append(delta(rank, prev));
  return td;
}
/** 광고까지 포함해 실제로 보이는 위치 */
function shownCell(r){
  const td = el('td','sm');
  if (r.is_ad) { const t = el('span','tag ad','광고 '+r.display_rank+'번'); td.append(t); return td; }
  if (r.display_rank == null) { td.textContent = r.rank == null ? '' : '–'; return td; }
  td.textContent = '노출 ' + r.display_rank + '위';
  if (r.ad_count) td.textContent += ' (광고 '+r.ad_count+')';
  return td;
}
function table(head, rows){
  const t = el('table'), thead = el('thead'), tr = el('tr');
  head.forEach(h => tr.append(el('th', null, h)));
  thead.append(tr);
  const tb = el('tbody'); rows.forEach(r => tb.append(r));
  t.append(thead, tb);
  const w = el('div','scroll'); w.append(t); return w;
}
function section(title, day, ...body){
  const s = el('section'), h = el('h2', null, title);
  if (day) h.append(el('span','day', day));
  s.append(h, ...body); return s;
}

// ---------- 순위 추이 차트 ----------
function rankChart(history, cap){
  const box = el('div','chart');
  const pts = history.filter(h => h.day);
  if (pts.length < 2){ box.append(el('div','empty','추이는 이틀치가 쌓이면 나옵니다.')); return box; }
  const ranked = pts.map(p => p.rank).filter(v => v != null);
  if (!ranked.length){ box.append(el('div','empty','아직 '+cap+'위 안에 든 적이 없습니다.')); return box; }

  const W=430, H=134, PL=38, PR=12, PT=12, PB=24;
  const lo = Math.max(1, Math.min(...ranked) - 1);
  const hi = Math.max(lo + 1, Math.max(...ranked) + 1);
  const x = i => PL + (W-PL-PR) * (pts.length===1 ? .5 : i/(pts.length-1));
  const y = v => PT + (H-PT-PB) * ((v-lo)/(hi-lo));
  const yOut = H - PB;

  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width','100%');
  const mk=(t,a)=>{const e=document.createElementNS(ns,t); for(const k in a) e.setAttribute(k,a[k]); return e;};
  const label=(xx,yy,txt,anchor)=>{const t=mk('text',{x:xx,y:yy,'text-anchor':anchor,fill:'var(--dim)','font-size':10});t.textContent=txt;return t;};

  for (const v of [...new Set([lo, Math.round((lo+hi)/2), hi])]){
    svg.append(mk('line',{x1:PL,x2:W-PR,y1:y(v),y2:y(v),stroke:'var(--line)','stroke-width':1}));
    svg.append(label(PL-6, y(v)+4, v+'위', 'end'));
  }
  const hasOut = pts.some(p => p.rank == null);
  if (hasOut){
    svg.append(mk('line',{x1:PL,x2:W-PR,y1:yOut,y2:yOut,stroke:'var(--line)','stroke-width':1,'stroke-dasharray':'3 3'}));
    svg.append(label(PL-6, yOut+4, '밖', 'end'));
  }
  let seg = [];
  const flush = () => {
    if (seg.length > 1) svg.append(mk('path',{d:seg.map((s,i)=>`${i?'L':'M'}${s[0].toFixed(1)},${s[1].toFixed(1)}`).join(' '),
      fill:'none',stroke:'var(--accent)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
    seg = [];
  };
  pts.forEach((pt,i)=>{ if (pt.rank == null) flush(); else seg.push([x(i), y(pt.rank)]); });
  flush();
  pts.forEach((pt,i)=>{
    const out = pt.rank == null;
    svg.append(mk('circle',{cx:x(i), cy: out ? yOut : y(pt.rank), r:3.5,
      fill: out ? 'var(--card)' : 'var(--accent)', stroke:'var(--accent)','stroke-width':1.5}));
  });
  [0, pts.length-1].forEach(i => svg.append(label(x(i), H-6, pts[i].day.slice(5), i?'end':'start')));
  box.append(svg);
  if (hasOut) box.append(el('div','hint','속이 빈 점은 '+cap+'위 밖입니다.'));
  return box;
}

async function placeDetail(keyword, placeId){
  const d = await api(`/api/place-detail?keyword=${encodeURIComponent(keyword)}&placeId=${encodeURIComponent(placeId)}`);
  const cols = el('div','cols');

  const left = el('div');
  left.append(el('h3','순위 추이'), rankChart(d.history, 100));
  cols.append(left);

  const right = el('div');
  right.append(el('h3', '상위 노출 업체' + (d.topDay ? ' · '+d.topDay : '')));
  if (!d.top.length) right.append(el('div','empty','수집 이력이 없습니다.'));
  else {
    const t = el('table','mini'), tb = el('tbody');
    d.top.forEach(r=>{
      const tr = el('tr');
      if (r.isMine) tr.className='mine';
      tr.append(el('td','r', r.rank+'.'));
      const nm = el('td', null, r.name + (r.isMine ? '  ← 내 매장' : ''));
      if (r.prev != null && r.prev !== r.rank) nm.append(delta(r.rank, r.prev));
      tr.append(nm);
      const bits = [];
      if (r.score) bits.push('★'+r.score);
      if (r.blog_reviews) bits.push('리뷰 '+r.blog_reviews.toLocaleString());
      tr.append(el('td','rv', bits.join(' · ')));
      tb.append(tr);
    });
    t.append(tb);
    const sc = el('div'); sc.style.cssText='max-height:300px;overflow-y:auto'; sc.append(t);
    right.append(sc);
  }
  cols.append(right);
  return cols;
}

/** 순위 행을 눌러 상세를 펼치게 만든다 */
function makeExpandable(tr, caretHost, keyword, placeId, colSpan){
  let open = null;
  tr.classList.add('clickable');
  tr.onclick = async () => {
    const caret = caretHost.querySelector('.caret');
    if (open){ open.remove(); open = null; tr.classList.remove('open'); caret.textContent='▸'; return; }
    tr.classList.add('open'); caret.textContent='▾';
    const dtr = el('tr','detail');
    const td = el('td'); td.colSpan = colSpan; td.append(el('div','empty','불러오는 중…'));
    dtr.append(td); tr.after(dtr); open = dtr;
    try { td.innerHTML=''; td.append(await placeDetail(keyword, String(placeId))); }
    catch(e){ td.innerHTML=''; td.append(el('div','empty','불러오기 실패: '+e.message)); }
  };
}

// ---------- 상단: 하락 알림 ----------
async function renderTop(){
  const top = $('#top');
  top.innerHTML = '';
  let data;
  try { data = await api('/api/summary'); } catch { return; }

  if (data.alerts?.length){
    const rows = data.alerts.map(a=>{
      const tr = el('tr');
      tr.append(el('td', null, a.label ?? ''), el('td','kw', a.keyword));
      const td = el('td','sm');
      td.textContent = a.kind === 'out'
        ? `${a.prev}위 → 100위 밖`
        : `${a.prev}위 → ${a.rank}위 (${a.drop}계단 하락)`;
      td.style.color = 'var(--down)';
      tr.append(td);
      return tr;
    });
    const sec = section('순위 하락 ' + data.alerts.length + '건', data.placePrevDay ? data.placePrevDay+' 대비' : null,
      table(['매장','키워드','변동'], rows));
    sec.classList.add('alert');
    top.append(sec);
  }
}

// ---------- 탭: 일별 추이 ----------
let dailyStore = null, dailyDays = 7, dailyMode = 'detail';

function rankTier(rank){
  if (rank == null) return 'tout';
  if (rank <= 3) return 't1';
  if (rank <= 10) return 't2';
  if (rank <= 30) return 't3';
  return 't4';
}

const WD = ['일','월','화','수','목','금','토'];
function dayHead(day){
  const d = new Date(day + 'T00:00:00Z');
  const w = WD[d.getUTCDay()];
  const th = el('th');
  th.append(document.createTextNode(day.slice(5) + '('));
  th.append(el('span', d.getUTCDay()===0 ? 'sun' : d.getUTCDay()===6 ? 'sat' : '', w));
  th.append(document.createTextNode(')'));
  return th;
}

/** 애드로그처럼 날짜별로 지표를 쌓아 보여주는 상세 블록 */
function detailBlock(kw, label, placeId, days){
  const wrap = el('div'); wrap.style.marginBottom = '22px';

  const head = el('div','blockhead');
  head.append(el('div','kwname', kw.keyword));
  head.append(el('div','storename', label));
  head.append(el('div','pid', `${label}(${placeId})`));
  wrap.append(head);

  const t = el('table','adlog');
  const thead = el('thead'), htr = el('tr');
  days.forEach(d => htr.append(dayHead(d)));
  thead.append(htr); t.append(thead);

  const cellByDay = new Map(kw.cells.map(c => [c.day, c]));
  const tr = el('tr');
  days.forEach(day=>{
    const c = cellByDay.get(day);
    const td = el('td');
    if (!c || !c.collected || c.rank === undefined){
      td.append(el('div','none','수집 없음'));
    } else {
      const rk = el('div','rk');
      if (c.rank == null){ rk.className = 'rk outr'; rk.textContent = '100위 밖'; }
      else rk.textContent = c.rank + '위';
      td.append(rk);
      if (c.isAd) td.append(el('div','adbadge','광고 ' + c.display + '번'));
      else if (c.display != null && c.display !== c.rank) td.append(el('div','g','노출 ' + c.display + '위'));

      if (c.saveCount) td.append(el('div','save', c.saveCount));
      if (c.blogReviews) td.append(el('div','m','블 ' + c.blogReviews.toLocaleString() + '개'));
      if (c.visitorReviews) td.append(el('div','m','방 ' + c.visitorReviews.toLocaleString() + '개'));
      if (c.volume != null) td.append(el('div','g','월 ' + c.volume.toLocaleString() + '건'));
      if (c.businesses != null) td.append(el('div','g','업체 ' + c.businesses.toLocaleString() + '개'));
      if (c.score) td.append(el('div','g','★ ' + c.score));
    }
    tr.append(td);
  });
  const tb = el('tbody'); tb.append(tr); t.append(tb);
  const sc = el('div','scroll'); sc.append(t);
  wrap.append(sc);
  return wrap;
}

/** 여러 키워드를 한눈에 훑는 격자 */
function compactGrid(d){
  const t = el('table','grid');
  const thead = el('thead'), htr = el('tr');
  htr.append(el('th','k','키워드'));
  d.days.forEach((day, i)=>{
    const dd = day.slice(8), mm = day.slice(5,7);
    const newMonth = i === 0 || d.days[i-1].slice(5,7) !== mm;
    const th = el('th', null, newMonth ? `${Number(mm)}/${Number(dd)}` : dd);
    if (newMonth) th.style.color = 'var(--ink)';
    th.title = day;
    htr.append(th);
  });
  htr.append(el('th', null, '최고'));
  thead.append(htr); t.append(thead);

  const tb = el('tbody');
  d.keywords.forEach(k=>{
    const tr = el('tr');
    const kt = el('td','k', k.keyword); kt.title = k.keyword;
    tr.append(kt);
    k.cells.forEach(c=>{
      const td = el('td');
      const cell = el('span','cell');
      if (!c.collected || c.rank === undefined){
        cell.className = 'cell tnone'; cell.textContent = '·'; cell.title = c.day + ' — 수집 안 됨';
      } else if (c.rank === null){
        cell.className = 'cell tout'; cell.textContent = '밖'; cell.title = c.day + ' — 100위 밖';
      } else {
        cell.className = 'cell ' + rankTier(c.rank);
        cell.textContent = c.rank;
        cell.title = c.day + ' — ' + c.rank + '위' + (c.display ? ' (노출 ' + c.display + '위)' : '');
      }
      td.append(cell); tr.append(td);
    });
    const best = el('td','k'); best.style.cssText='position:static;text-align:center;font-weight:600';
    best.textContent = k.best != null ? k.best + '위' : '–';
    tr.append(best);
    tb.append(tr);
  });
  t.append(tb);
  const sc = el('div','scroll'); sc.append(t);

  const box = el('div'); box.append(sc);
  const lg = el('div','legend');
  [['t1','1–3위'],['t2','4–10위'],['t3','11–30위'],['t4','31–100위'],['tout','밖'],['tnone','미수집']].forEach(([c,label])=>{
    const w = el('span'); w.style.cssText='display:inline-flex;align-items:center;gap:5px';
    w.append(el('span','cell '+c, c==='tnone'?'·':''), document.createTextNode(label));
    lg.append(w);
  });
  box.append(lg);
  return box;
}

async function renderDaily(view){
  // 대상 관리에 등록된 매장을 그대로 보여준다 (수집 기록이 없어도 목록에는 나온다)
  const cfg = await api('/api/targets');
  const stores = cfg.places.map(t => ({ placeId: String(t.placeId), label: t.label }));
  if (!stores.length)
    return view.append(section('일별 추이', null, el('div','empty','추적 중인 매장이 없습니다. 대상 관리에서 먼저 추가하세요.')));

  if (!stores.some(s => s.placeId === String(dailyStore))) dailyStore = stores[0].placeId;

  const sel = el('select');
  stores.forEach(t=>{
    const o = el('option', null, t.label); o.value = t.placeId;
    if (t.placeId === String(dailyStore)) o.selected = true;
    sel.append(o);
  });
  sel.onchange = () => { dailyStore = sel.value; render(); };

  const modes = el('div','modes');
  [['detail','상세'],['compact','한눈에']].forEach(([m,label])=>{
    const btn = el('button', dailyMode===m ? 'on' : '', label);
    btn.onclick = () => { dailyMode = m; if (m==='detail' && dailyDays > 30) dailyDays = 30; render(); };
    modes.append(btn);
  });

  const range = el('select');
  const opts = dailyMode==='detail' ? [[7,'최근 7일'],[14,'최근 2주'],[30,'최근 한 달']]
                                    : [[14,'최근 2주'],[30,'최근 한 달'],[60,'최근 두 달'],[90,'최근 세 달']];
  if (!opts.some(([v])=>v===dailyDays)) dailyDays = opts[0][0];
  opts.forEach(([v,t])=>{
    const o = el('option', null, t); o.value = v;
    if (v === dailyDays) o.selected = true;
    range.append(o);
  });
  range.onchange = () => { dailyDays = Number(range.value); render(); };

  const body = el('div'); body.style.marginTop='16px';
  const sec = section('일별 순위', null, (()=>{const r=el('div','row'); r.append(sel, range, modes); return r;})(), body);
  view.append(sec);

  const pad = dailyMode === 'detail' ? '&pad=1' : '';
  const d = await api(`/api/daily?placeId=${encodeURIComponent(dailyStore)}&days=${dailyDays}${pad}`);
  if (!d.keywords.length) return body.append(el('div','empty',
    '이 매장은 아직 수집 기록이 없습니다.'));

  if (dailyMode === 'detail'){
    const newestFirst = [...d.days].reverse();          // 애드로그처럼 최신이 왼쪽
    d.keywords.forEach(k => body.append(detailBlock(k, d.label, d.placeId, newestFirst)));
  } else {
    body.append(compactGrid(d));
  }
  if (d.missingDays.length)
    body.append(el('div','hint', `수집이 없는 날 ${d.missingDays.length}일: ${d.missingDays.slice(0,6).join(', ')}${d.missingDays.length>6?' 외':''}`));
}

// ---------- 탭: 키워드별 ----------
async function renderKeyword(view){
  const data = await api('/api/summary');
  if (!(data.place.length || data.blog.length || data.volume.length))
    return view.append(section('시작하기', null, el('div','empty','아직 수집된 데이터가 없습니다.')));

  if (data.place.length){
    const rows = [...data.place].sort((a,b)=>a.keyword.localeCompare(b.keyword)).map(r=>{
      const tr = el('tr');
      const kw = el('td','kw');
      kw.append(el('span','caret','▸'), document.createTextNode(r.keyword));
      tr.append(kw, el('td', null, r.label ?? ''), rankCell(r.rank, r.prev, 100), shownCell(r));
      makeExpandable(tr, kw, r.keyword, r.place_id, 4);
      return tr;
    });
    const sec = section('플레이스 순위', data.placeDay, table(['키워드','매장','자연 순위','실제 노출'], rows));
    sec.insertBefore(el('div','hint','행을 누르면 순위 추이와 상위 노출 업체를 볼 수 있습니다.'), sec.children[1]);
    view.append(sec);
  }

  if (data.blog.length){
    const rows = [...data.blog].sort((a,b)=>a.keyword.localeCompare(b.keyword)).map(r=>{
      const tr = el('tr');
      tr.append(el('td','kw', r.keyword), el('td', null, r.label ?? ''), rankCell(r.rank, r.prev, 90));
      const u = el('td');
      if (r.url){ const a = el('a', null, '글 보기'); a.href=r.url; a.target='_blank'; a.rel='noreferrer'; a.style.fontSize='13px'; u.append(a); }
      tr.append(u); return tr;
    });
    view.append(section('블로그 순위', data.blogDay, table(['키워드','블로그','순위',''], rows)));
  }

  if (data.volume.length){
    const rows = data.volume.map(r=>{
      const tr = el('tr');
      [r.keyword, r.total?.toLocaleString(), r.pc?.toLocaleString(), r.mobile?.toLocaleString(), r.competition ?? '-']
        .forEach((c,i)=>{ const td = el('td', i===0?'kw':null, c); if(i) td.style.fontVariantNumeric='tabular-nums'; tr.append(td); });
      return tr;
    });
    view.append(section('월간 검색량', data.volumeDay, table(['키워드','합계','PC','모바일','경쟁도'], rows)));
  }
}

// ---------- 탭: 대상 관리 (읽기 전용) ----------
const SRC_LABEL = { sync:'고객관리', sheet:'구글시트', local:'직접 추가' };

async function renderManage(view){
  const cfg = await api('/api/targets');
  const listSec = section('추적 중인 대상', null);
  listSec.append(el('div','hint','읽기 전용 스냅샷입니다. 대상·키워드는 구글시트(트래픽 일정관리)에서 관리하며, 매일 수집 때 자동으로 반영됩니다.'));
  let any = false;
  for (const [type, title, list] of [['place','플레이스', cfg.places ?? []], ['blog','블로그', cfg.blogs ?? []]]){
    if (!list.length) continue;
    any = true;
    listSec.append(el('div','hint', title));
    for (const t of list){
      const row = el('div','pick'); row.style.alignItems='flex-start';
      const left = el('div'); left.style.flex='1';

      const head = el('div');
      head.append(el('span','nm', t.label), document.createTextNode(' '));
      (t.sources ?? [t.source]).forEach(src => {
        head.append(el('span','tag'+(src==='local'?' local':''), SRC_LABEL[src] ?? src),
                    document.createTextNode(' '));
      });
      left.append(head);

      const chips = el('div'); chips.style.marginTop='6px';
      (t.keywords ?? []).forEach(k=>{
        const c = el('span','chip', k);
        c.style.padding = '3px 10px';
        chips.append(c);
      });
      left.append(chips);

      if (t.hiddenKeywords?.length){
        const hid = el('div'); hid.style.marginTop='4px';
        hid.append(el('span','hint','제외됨 '));
        t.hiddenKeywords.forEach(k=>{
          const c = el('span','chip off', k);
          c.style.padding = '3px 10px';
          hid.append(c);
        });
        left.append(hid);
      }

      row.append(left);
      listSec.append(row);
    }
  }
  if (!any) listSec.append(el('div','empty','아직 추적 대상이 없습니다.'));
  view.append(listSec);
}

// ---------- 라우팅 ----------
async function render(){
  const view = $('#view');
  view.innerHTML = '';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  try {
    if (tab==='store') await renderStore(view);
    else if (tab==='daily') await renderDaily(view);
    else if (tab==='manage') await renderManage(view);
    else await renderKeyword(view);
  } catch(e){ view.append(el('div','empty','불러오기 실패: '+e.message)); }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; picked = null; search = { q:'', items:null }; render();
});

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function boot(pw, remember){
  DATA = await unlock(pw);                      // 비밀번호가 틀리면 여기서 throw
  if (remember) try { sessionStorage.setItem('rt-pw', pw); } catch {}
  $('#lock').remove();
  $('.wrap').style.display = '';
  $('#hd').textContent = '네이버 순위 추적';
  $('#hdsub').textContent = '웨이팅랩 사내용 · 읽기 전용 스냅샷 · 게시 '
    + (DATA.generatedAt || '').slice(0, 16).replace('T', ' ');
  renderTop();
  render();
}

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem('rt-pw'); } catch {}
  if (saved){
    try { await boot(saved, false); return; }
    catch { try { sessionStorage.removeItem('rt-pw'); } catch {} }
  }
  $('#lockForm').onsubmit = async e => {
    e.preventDefault();
    $('#lockErr').style.display = 'none';
    try { await boot($('#lockPw').value, true); }
    catch { $('#lockErr').style.display = 'block'; }
  };
})();
</script>
